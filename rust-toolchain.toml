# Pins the Rust toolchain used inside this directory tree.
#
# rustup reads this on every cargo/rustc invocation here and installs the
# named channel + components on first use. Keeps local builds identical
# to CI. Must stay in lockstep with `rust-version` in Cargo.toml and the
# pinned action in `.github/workflows/ci.yml`.

[toolchain]

# Exact-version pin (reproducible). "stable" would float and silently
# bump the floor.
channel = "1.95.0"

# rustfmt + clippy required by the project's lint/doc rules; rust-src
# lets rust-analyzer resolve std symbols (jump-to-def on Vec, Iterator,
# etc.) and unblocks future `-Z build-std` work.
components = ["rustfmt", "clippy", "rust-src"]

# "minimal" + explicit `components` keeps the install lean — nothing
# lands on disk that wasn't requested. ("default" would be redundant
# since rustfmt + clippy are already listed.)
profile = "minimal"
