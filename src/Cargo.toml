# `spark` binary crate. Wires engine plugins together. Lives under
# `src/` (not the repo root) so the workspace manifest stays virtual.

[package]
name = "spark"
version = "0.1.0"

edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `path` overrides Cargo's default `src/src/main.rs` discovery so
# `main.rs` can live next to this manifest.
[[bin]]
name = "spark"
path = "main.rs"

# Lints inlined (not `workspace = true`) because we need to override one
# pedantic lint locally — `needless_pass_by_value`. Cargo's lint table
# is mutually exclusive between `workspace = true` and a local
# `[lints.X]`, so the workspace defaults are mirrored here verbatim.
# Keep this block in sync with `[workspace.lints.*]` in the root
# `Cargo.toml` when those defaults change.
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# `Res<T>` / `ResMut<T>` / `Query<D>` are SystemParam values: `IntoSystem`'s
# calling convention hands them to user fns by value, never by reference.
# The clippy `needless_pass_by_value` lint can't see that contract and
# fires on every system signature. Suppress it for the binary crate
# where systems live; engine crates still see the lint.
needless_pass_by_value = "allow"

[dependencies]
spark-core = { path = "../lib/core" }
spark-ecs = { path = "../lib/ecs" }
spark-log = { path = "../lib/log" }
spark-window = { path = "../lib/window" }
