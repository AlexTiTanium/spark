# Foundation crate. Bottom of the engine dependency graph; kept small.
# Imported as `spark_core::...`.

[package]
name = "spark-core"
version = "0.1.0"

edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]

# `EngineError` is `pub use anyhow::Error`.
anyhow.workspace = true

# `Application` embeds a `World` so plugins have a canonical home for
# long-lived state. spark-ecs is stdlib-only and sits below this crate
# in the dependency graph.
spark-ecs = { path = "../ecs" }
