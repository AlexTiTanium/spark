# OS window + event-loop crate, built on `winit`. Exposes `WindowPlugin`
# (the idiomatic entry point) and the underlying free `run()`.
# Subscriber install lives in `spark-log`, not here.

[package]
name = "spark-window"
version = "0.1.0"
readme = "README.md"

edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
spark-core = { path = "../core" }
spark-common = { path = "../common" }   # Time resource — owns the 60 Hz clock the runner reads
# Window forwards OS input into the world as `spark-input`'s events: it depends
# on `spark-input` to name those event types, and on `spark-ecs` to reach the
# `Events<T>` buffers it sends them into. The dependency points only this way —
# `spark-input` never depends back on the window.
spark-input = { path = "../input" }
spark-ecs = { path = "../ecs" }

winit.workspace = true
tracing.workspace = true
thiserror.workspace = true
