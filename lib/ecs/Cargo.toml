# ECS crate. Deepest foundation crate in the engine dependency graph —
# every other engine crate (including `spark-core`) sits on top. The
# runtime crate is stdlib-only; its single dependency is the nested
# `spark-ecs-macros` derive crate (a build-time artefact). `World`,
# entities, components, queries, systems, and `Commands` ship today;
# the parallel scheduler lands in M4 (see docs/ECS_DESIGN.md).

[package]
name = "spark-ecs"
version = "0.1.0"
readme = "README.md"

# Inherited from [workspace.package] in the root manifest.
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# The only dependency is the sibling derive crate nested at
# `lib/ecs/macros/` — a build-time artefact, not an external runtime dep.
# `spark-ecs` re-exports its `Component` / `Resource` derives so consumers
# import only `spark-ecs`. The dep graph stays cycle-free: macros never
# depends back on `spark-ecs` (the generated path resolves at the use site).
[dependencies]
spark-ecs-macros = { path = "macros" }
