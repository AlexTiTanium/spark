name: Miri (spark-ecs)

# Machine-checks the one `unsafe fn` in the crate — `DenseMut::get`,
# which hands out `&mut T` into a storage's dense array by raw pointer —
# under Miri's Stacked/Tree Borrows model. A double-borrow of one dense
# slot (the "fetched at most once" invariant) surfaces here as a hard
# error instead of silent UB. Scoped to `spark-ecs` to bound CI time
# (Miri interprets every operation); this is the only crate with `unsafe`.
# It also seeds the M4 baseline for the `UnsafeCell` switchover.
#
# Cost control: the run is scoped to `--lib query`, not the whole crate.
# `DenseMut::get` (query/dense_mut.rs) is the crate's only `unsafe fn`, and
# it is reached *only* through multi-mut query joins, so the `query::tests`
# modules are the entire UB-detection surface. Interpreting the other ~270
# safe unit tests, every integration test, and all doctests under Miri buys
# zero aliasing coverage at full interpreter cost — so they are excluded
# (`--lib` drops doctests + integration; `query` drops unrelated unit tests).
# `-Zmiri-disable-isolation` trims syscall-emulation overhead; the borrow
# model that does the actual checking stays on.
#
# One module inside `query::tests` is gated out at the source level rather
# than by this filter: `driver_cost` is a driver-step *count* oracle that
# builds 10_000-entity worlds, so it is `#[cfg(not(miri))]` (see
# query/tests.rs). It is pure safe code — it never forms a multi-mut tuple,
# so it never reaches `DenseMut::get` — yet under the interpreter its 34
# ×10k-entity worlds ran ~27 min and pushed this job past its 30-min budget
# for zero aliasing coverage. The substring filter can only *add* names, not
# drop one module, so the carve-out lives next to the tests. Everything that
# actually touches `unsafe` (joins + the `&mut` paths in data) still runs
# here; the run is now ~4 min, so the timeout below catches genuine
# regressions instead of normal interpreter cost.
#
# Conditional cadence (deviation from #80, recorded in the PR body): most
# PRs never touch unsafe, so this only fires when the relevant surface
# moves (path filter below), plus a weekly cron for toolchain / nightly
# drift and a manual dispatch button. The aliasing-stress test also drops
# to a reduced N under `cfg(miri)` so the interpreter cost stays bounded
# when the filter fires — coverage comes from access-pattern diversity,
# not raw entity count.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'  # weekly safety sweep — Mon 04:00 UTC
  pull_request:
    paths:
      # `query/**` covers the submodule but does NOT cover the sibling
      # `query.rs` root (DriverIter / DriveSource / DriverPlan — the
      # types that feed the unsafe lookup); list it explicitly.
      - 'lib/ecs/src/query.rs'
      - 'lib/ecs/src/query/**'
      - 'lib/ecs/src/storage.rs'
      - 'lib/ecs/src/access.rs'
      - 'lib/ecs/src/filter.rs'
      - '.github/workflows/miri.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  miri:
    name: Miri (spark-ecs)
    runs-on: ubuntu-latest
    # Bound an interpreter hang so a runner doesn't burn indefinitely.
    timeout-minutes: 30
    env:
      # Decouple from nightly lint drift: this job is about UB detection,
      # not warnings (clippy/test enforce those on the pinned stable).
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Build the Miri sysroot as its own step so the cold-sysroot spike is
      # visible (and cached by rust-cache, keyed on the nightly version)
      # separately from interpretation time.
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p spark-ecs --lib query
        env:
          # Skip syscall isolation emulation — pure interpreter speedup, no
          # effect on the Stacked/Tree Borrows aliasing check this job exists for.
          MIRIFLAGS: "-Zmiri-disable-isolation"
