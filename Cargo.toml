# Workspace root manifest. Virtual — Cargo uses it only to discover
# members and host shared package/lint/dep settings. New engine crates
# under `lib/<name>/` are picked up automatically by the `lib/*` glob.

[workspace]

# Resolver 3: per-target/per-kind feature unification + MSRV-aware
# version resolution. Edition 2024 defaults to "3"; setting it
# explicitly documents intent.
resolver = "3"

# `lib/*` is one level deep, so the nested proc-macro crate at
# `lib/ecs/macros/` needs its own explicit entry — a workspace requires
# every package to be a listed member, and the glob won't reach it.
members = ["lib/*", "lib/ecs/macros", "src"]

[workspace.package]
edition = "2024"

# MSRV. Must agree with `channel` in `rust-toolchain.toml` and CI.
rust-version = "1.95"

license = "MIT OR Apache-2.0"

# Shared deps, pinned exact patch. Members opt in with
# `<name>.workspace = true`. Bumps are manual — no Dependabot.
[workspace.dependencies]

winit = "0.30.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0.18"

# Erased error type used at every Plugin → Application seam. Re-exported
# by `spark-core` as `EngineError`.
anyhow = "1.0.102"

# Proc-macro toolchain for the `spark-ecs-macros` derive crate. syn
# parses the annotated `#[derive(…)]` item, quote builds the generated
# `impl`, and proc-macro2 is the token type they share. syn's default
# features cover a marker derive (derive + parsing + printing); `full`
# is not needed.
syn = "2.0.117"
quote = "1.0.45"
proc-macro2 = "1.0.106"

[workspace.lints.rust]

# Warn (not deny) so accidental `unsafe` shows up in CI without blocking.
unsafe_code = "warn"

[workspace.lints.clippy]

# `priority = -1` lets individual lints override pedantic without
# fighting each other.
pedantic = { level = "warn", priority = -1 }
